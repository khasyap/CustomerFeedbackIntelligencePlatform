version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feedback_intelligence_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./customer_feedback.db
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - RANDOM_SEED=20261022
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - db_data:/app
    restart: unless-stopped

volumes:
  db_data:

